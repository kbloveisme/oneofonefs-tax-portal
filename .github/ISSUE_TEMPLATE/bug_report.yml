name: Bug Report
description: Report a bug or broken functionality in the tax portal
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: ["kbloveisme"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix it quickly.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the bug.
      placeholder: e.g. "Booking button does not scroll to the booking section on mobile"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Open the portal on a mobile browser
        2. Tap "Book Individual Appointment"
        3. Nothing happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser / Environment
      multiple: true
      options:
        - Chrome (desktop)
        - Firefox (desktop)
        - Safari (desktop)
        - Chrome (mobile)
        - Safari (mobile)
        - Other
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Paste any relevant screenshots or console errors here.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this consistently.
          required: false
