# Repository label definitions
# Apply with: gh label clone --repo kbloveisme/oneofonefs-tax-portal
# or use the GitHub CLI: gh label create ...

- name: bug
  color: d73a4a
  description: Something isn't working correctly

- name: enhancement
  color: a2eeef
  description: New feature or improvement request

- name: needs-triage
  color: e4e669
  description: Newly opened — awaiting initial review and categorization

- name: needs-review
  color: fbca04
  description: PR or issue is ready for human review

- name: in-progress
  color: 0075ca
  description: Actively being worked on

- name: blocked
  color: b60205
  description: Cannot proceed until another issue or PR is resolved

- name: wontfix
  color: ffffff
  description: This will not be worked on

- name: duplicate
  color: cfd3d7
  description: This issue or PR already exists

- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation

- name: ui
  color: bfd4f2
  description: Related to HTML, CSS, or visual appearance

- name: javascript
  color: f9d0c4
  description: Related to JavaScript / client-side logic

- name: ci
  color: 5319e7
  description: Related to GitHub Actions or CI/CD workflows

- name: booking
  color: c2e0c6
  description: Related to appointment booking functionality

- name: upload
  color: d4c5f9
  description: Related to document upload functionality

- name: mobile
  color: fef2c0
  description: Related to mobile or responsive behavior

- name: security
  color: ee0701
  description: Security vulnerability or concern
