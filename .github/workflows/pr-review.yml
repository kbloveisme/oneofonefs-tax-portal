name: PR Review – Auto-label, Assign & Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-and-assign:
    name: Label & assign PR
    runs-on: ubuntu-latest

    steps:
      - name: Auto-label PR by changed files
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: pr.number,
            });

            const changed = files.data.map(f => f.filename);
            const labelsToAdd = new Set(["needs-review"]);

            for (const file of changed) {
              if (file.endsWith(".html"))              labelsToAdd.add("ui");
              if (file.endsWith(".css"))               labelsToAdd.add("ui");
              if (file.endsWith(".js"))                labelsToAdd.add("javascript");
              if (file.startsWith(".github/workflows")) labelsToAdd.add("ci");
              if (file.toLowerCase().includes("readme")) labelsToAdd.add("documentation");
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: pr.number,
              labels: [...labelsToAdd],
            });

      - name: Request review from code owner
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // Don't request review from the PR author themselves
            if (pr.user.login !== "kbloveisme") {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                pull_number: pr.number,
                reviewers: ["kbloveisme"],
              }).catch(() => {
                // Silently ignore if the user can't be added as reviewer
              });
            }

      - name: Post PR checklist comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // Only post on first open, not on subsequent pushes
            if (context.payload.action !== "opened") return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: pr.number,
              body: [
                "## 🤖 Automated PR Review Checklist",
                "",
                "Thanks for opening this PR! Please ensure the following before merging:",
                "",
                "- [ ] PR description is filled out using the template",
                "- [ ] Related issue(s) are linked (e.g. `Closes #N`)",
                "- [ ] HTML is valid (CI lint check passes)",
                "- [ ] Tested in at least one browser",
                "- [ ] No secrets or sensitive data committed",
                "",
                "_This comment was posted automatically by the pr-review workflow._",
              ].join("\n"),
            });

  validate-pr-template:
    name: Validate PR body
    runs-on: ubuntu-latest

    steps:
      - name: Check that PR body is not empty
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || "").trim();
            if (body.length < 30) {
              core.setFailed(
                "PR description is too short. Please fill out the pull request template."
              );
            }
