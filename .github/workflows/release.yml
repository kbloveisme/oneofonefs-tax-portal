name: Release – Deploy on merge to main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  tag-release:
    name: Create release tag
    runs-on: ubuntu-latest

    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: tag
        # Security: replace @v6.2 with the full commit SHA of that release before using in production.
        # Find the SHA at: https://github.com/mathieudutour/github-tag-action/releases/tag/v6.2
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          release_name: "Release ${{ steps.tag.outputs.new_tag }}"
          body: |
            ## Changes in ${{ steps.tag.outputs.new_tag }}

            ${{ steps.tag.outputs.changelog }}

            ---
            _Auto-generated by the release workflow on merge to `main`._
          draft: false
          prerelease: false

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: tag-release

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
